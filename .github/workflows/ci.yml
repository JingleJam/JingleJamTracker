name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Pages Functions
        run: npx wrangler pages functions build --outdir "$RUNNER_TEMP/pages-functions"

      - name: Build Worker (production)
        run: npx wrangler deploy --env="" --dry-run --outdir "$RUNNER_TEMP/worker-production"
        working-directory: ./workers/tiltify-cache

      - name: Build Worker (development)
        run: npx wrangler deploy -e development --dry-run --outdir "$RUNNER_TEMP/worker-development"
        working-directory: ./workers/tiltify-cache
